<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <title>Post Method</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Post Method Form Submit</h1>

    <div id="main">

        <form action="http://localhost:3000/form" method="post">
            <input placeholder="Enter Name" name="name">
            <input placeholder="Enter Email" name="mail">
            <input placeholder="Enter Address" name="address">
            <button type="submit">Submit</button>
        </form>
        <!-- <button id="clr">Clear Form</button> -->
        <img src="delete.png" id="clr">
    </div>


    <script src="script.js"></script>
</body>

</html>
